[package]
name = "zul-mcp"
version.workspace = true
edition.workspace = true
description = "MCP stdio server exposing Zulip data"
license.workspace = true

[[bin]]
name = "zul-mcp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
dotenvy.workspace = true
libzul.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "net", "rt", "sync", "time"] }

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
