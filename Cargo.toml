[workspace]
resolver = "2"
members = [
    "crates/libzul",
    "crates/zul-cli",
    "crates/zul-tui",
]
default-members = [
    "crates/libzul",
    "crates/zul-cli",
    "crates/zul-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1.0"
assert_cmd = "2.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29"
directories = "6.0"
dotenvy = "0.15"
image = "0.25"
libzul = { path = "crates/libzul" }
predicates = "3.1"
ratatui = "0.30"
ratatui-image = { version = "11.0", default-features = false, features = ["crossterm", "image-defaults"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "query", "rustls"] }
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
scraper = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.10"
tokio = { version = "1.39", features = ["macros", "rt-multi-thread"] }
toml = "1.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
wiremock = "0.6"
