[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "zul-bridge"
description = "Hermes Zulip adapter and blocking Python bridge over libzul"
requires-python = ">=3.11"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = []

[project.scripts]
hermes-zulip-install = "hermes_zulip.install:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "PyYAML>=6",
]

[tool.maturin]
module-name = "zul_bridge"
python-source = "python"
python-packages = ["hermes_zulip"]
# `extension-module` stops pyo3 linking libpython on Unix; only the wheel build
# wants that, so plain `cargo test` does not enable it.
features = ["extension-module"]
include = [
    { path = "python/hermes_zulip/plugin.yaml", format = ["wheel", "sdist"] },
    { path = "python/hermes_zulip/*.py", format = ["wheel", "sdist"] },
]
exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
