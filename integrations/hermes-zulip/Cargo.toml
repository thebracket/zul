[package]
name = "hermes-zulip-bridge"
version = "0.1.0"
edition = "2021"
publish = false
description = "PyO3 bridge exposing libzul's Zulip client to the Hermes Zulip adapter"
license = "AGPL-3.0-or-later"

[lib]
name = "zul_bridge"
crate-type = ["cdylib", "rlib"]

# Standalone crate: not a member of the repository workspace.
[workspace]

[dependencies]
libzul = { path = "../../crates/libzul" }
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }
serde_json = "1.0"
tokio = { version = "1.39", features = ["rt", "sync", "time"] }

[dev-dependencies]
wiremock = "0.6"

[features]
# Enabled only by maturin (see pyproject.toml). A plain `cargo test` keeps
# libpython linked so the test harness can start.
extension-module = ["pyo3/extension-module"]
